name: Update CCTV live list

on:
  schedule:
    # 하루 한 번 — KST 00:07 (UTC 15:07). 분을 :07로 둔 이유는 정각·15·30·45분에
    # 전 세계 예약 작업이 몰려 GitHub이 실행을 더 밀리는 경향이 있어서이다.
    - cron: '7 15 * * *'   # KST 00:07
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.actor == 'tantran21501'
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      GEMINI_URL: https://generativelanguage.googleapis.com/v1beta/models/{{GEMINI_MODEL}}:generateContent?key={{GEMINI_API_KEY}}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_MODEL: ${{ secrets.MISTRAL_MODEL || 'mistral-large-latest' }}
      MISTRAL_URL: ${{ secrets.MISTRAL_URL || 'https://api.mistral.ai/v1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run update script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update.mjs

      # ---- AI 썸네일 카테고리 분류 (CLIP 제로샷, 행당 1회만 수행) ----
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-clip-${{ runner.os }}-v2-ultralytics

      - name: Cache CLIP model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clip-vit-base-patch32-v1

      - name: Install Python dependencies
        run: |
          # torchvision을 반드시 torch와 같은 CPU 인덱스에서 같이 깐다. 따로 두면 ultralytics가
          # 의존성으로 기본 PyPI의 CUDA 빌드 torchvision을 끌어오는데, +cpu torch와 ABI가 안 맞아
          # "RuntimeError: operator torchvision::nms does not exist"로 CLIP 단계가 죽는다(실제로 겪음).
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers pillow requests ultralytics

      - name: Classify thumbnails with CLIP
        run: python scripts/classify_thumbnails.py

      - name: Resolve camera locations
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/location_resolver.py

      - name: AI resolve remaining locations
        continue-on-error: true
        run: python scripts/ai_location_resolver.py

      - name: Export locations snapshot
        run: python scripts/export_locations.py

      # 트래픽 계열 카메라의 차량을 세어 쌓는다. 지금은 수집만 — 프레임 한 장은 표본이 아니라
      # 몇 주 누적한 뒤에 집계 페이지를 낸다. 실패해도 자동화 전체를 세우지 않는다.
      - name: Count vehicles in traffic cams
        continue-on-error: true
        run: python scripts/detect_vehicles.py

      # ---- AI 검수: 승인 대기 큐를 Gemini로 자동 판정 (GEMINI_API_KEY 없으면 스킵) ----
      - name: AI review pending queue
        run: node scripts/ai_review.mjs

      # ---- 최종 산출물(data/*.json 등) 변경분만 커밋 ----
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # 작업 도중 main에 새 커밋이 올라왔을 수 있으므로 rebase 후 푸시 (경합으로 인한 push 실패 방지)
          git diff --cached --quiet || (git commit -m "Update camera data" && git pull --rebase origin main && git push)
