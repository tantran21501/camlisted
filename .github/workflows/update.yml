name: Update CCTV live list

on:
  schedule:
    # 하루 두 번 도는 이유는 수집량을 늘리려는 게 아니라 '한 번은 돌게' 하려는 것이다.
    # GitHub은 예약 실행을 부하에 따라 미루는데, 실측해 보니 15:07 예약이 18:15 → 20:37로
    # 매일 3~5시간씩 밀렸고 2026-08-06에는 8시간이 지나도록 아예 실행되지 않았다.
    # 그날 "오늘의 새 영상"이 0이 됐다. 두 번을 12시간 간격으로 벌려 두면 한쪽이 통째로
    # 빠져도 그날 수집이 비지 않는다. 대신 실행당 검색 예산을 47회로 반 나눴다
    # (검색 1회 = 100유닛, 하루 한도 10,000이라 두 번 다 95회를 쓰면 한도를 넘는다).
    #
    # 분을 정각·15·30·45분에서 떨어뜨린 건 그 시각에 전 세계 예약 작업이 몰리기 때문이다.
    - cron: '7 15 * * *'   # KST 00:07
    - cron: '23 3 * * *'   # KST 12:23 — 12시간 뒤 예비
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run update script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update.mjs

      # ---- AI 썸네일 카테고리 분류 (CLIP 제로샷, 행당 1회만 수행) ----
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-clip-${{ runner.os }}-v2-ultralytics

      - name: Cache CLIP model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clip-vit-base-patch32-v1

      - name: Install Python dependencies
        run: |
          # torchvision을 반드시 torch와 같은 CPU 인덱스에서 같이 깐다. 따로 두면 ultralytics가
          # 의존성으로 기본 PyPI의 CUDA 빌드 torchvision을 끌어오는데, +cpu torch와 ABI가 안 맞아
          # "RuntimeError: operator torchvision::nms does not exist"로 CLIP 단계가 죽는다(실제로 겪음).
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers pillow requests ultralytics

      - name: Classify thumbnails with CLIP
        run: python scripts/classify_thumbnails.py

      - name: Resolve camera locations
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/location_resolver.py

      - name: AI resolve remaining locations
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_location_resolver.py

      - name: Export locations snapshot
        run: python scripts/export_locations.py

      # 트래픽 계열 카메라의 차량을 세어 쌓는다. 지금은 수집만 — 프레임 한 장은 표본이 아니라
      # 몇 주 누적한 뒤에 집계 페이지를 낸다. 실패해도 자동화 전체를 세우지 않는다.
      - name: Count vehicles in traffic cams
        continue-on-error: true
        run: python scripts/detect_vehicles.py

      # ---- AI 검수: 승인 대기 큐를 Gemini로 자동 판정 (GEMINI_API_KEY 없으면 스킵) ----
      - name: AI review pending queue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # GEMINI_MODEL 고정은 뺐다. 비용을 아끼려고 gemini-2.0-flash-lite를 앞세워 봤지만
          # 무료 티어에서 이 구형 모델은 할당량이 아예 0이라(429 "free_tier_input_token_count,
          # limit: 0") 매 실행마다 실패 요청 하나만 낭비했다. 스크립트가 후보를 순서대로
          # 시도하므로, 고정 없이 두면 그때 쓸 수 있는 모델(현재 gemini-flash-latest)이 선택된다.
        run: node scripts/ai_review.mjs

      # ---- 최종 산출물(data/*.json 등) 변경분만 커밋 ----
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # 작업 도중 main에 새 커밋이 올라왔을 수 있으므로 rebase 후 푸시 (경합으로 인한 push 실패 방지)
          git diff --cached --quiet || (git commit -m "Update camera data" && git pull --rebase origin main && git push)
